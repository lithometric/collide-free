[package]
name = "collide-hooks"
version = "0.1.0"
edition = "2021"
description = "Collide's agent hooks as one native binary: the gate, the reporter, the watcher"
license = "MIT"

[lib]
name = "collide_hooks"
path = "src/lib.rs"

[[bin]]
name = "collide-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
# the typed-edit applier: tree-sitter lives here, and the source it edits
# lives on this machine, never on the server
collide-core = { path = "../core", default-features = false }
regex = "1"
# the ported patterns use lookahead/lookbehind, which `regex` does not do
fancy-regex = "0.13"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# self-updates are accepted only with CI's Ed25519 signature
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
